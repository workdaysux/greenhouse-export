name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run syntax checks
        run: |
          python3 -m py_compile greenhouse_export.py
          python3 -m py_compile launcher.py
          bash -n greenhouse_export.sh

      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -q dist/greenhouse_export_${GITHUB_REF_NAME}.zip \
            greenhouse_export.py \
            launcher.py \
            greenhouse_export.sh \
            .env.template \
            README.md \
            QUICK_START.txt \
            ABOUT.md \
            .gitignore \
            -x ".git/*" "*.pyc" "__pycache__/*" "build/*" "dist/*"
          chmod +x dist/greenhouse_export_${GITHUB_REF_NAME}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/greenhouse_export_*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
